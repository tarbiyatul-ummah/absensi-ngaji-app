<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Membuka Aplikasi...</title>
    <script>
      (function () {
        var redirectKey = "absensi-ngaji:redirect-path";
        var redirectPath = window.location.pathname + window.location.search + window.location.hash;

        if (redirectPath && redirectPath !== "/") {
          window.sessionStorage.setItem(redirectKey, redirectPath);
        }

        window.location.replace("/");
      })();
    </script>
  </head>
  <body>
    Membuka aplikasi...
  </body>
</html>
